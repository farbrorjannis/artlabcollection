<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>ArtLab — Free Artist Tools | akvarellskiss.se</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { background: #F5F5F0; font-family: Georgia, serif; color: #3E2723; }

.al-wrap { max-width: 900px; margin: 0 auto; padding: 2rem 1rem 3rem; }

.al-header { text-align: center; margin-bottom: 2rem; border-bottom: 1.5px solid #D7CCC8; padding-bottom: 1.5rem; }
.al-logo { font-size: 11px; letter-spacing: 0.14em; color: #8D6E63; text-transform: uppercase; margin-bottom: 0.5rem; }
.al-logo a { color: #8D6E63; text-decoration: none; }
.al-logo a:hover { color: #4E342E; }
.al-title { font-size: 2rem; font-weight: 400; color: #4E342E; margin-bottom: 0.4rem; }
.al-subtitle { font-size: 1rem; color: #6D4C41; line-height: 1.6; max-width: 520px; margin: 0 auto; }

.al-controls { display: flex; gap: 10px; margin-bottom: 1.5rem; flex-wrap: wrap; align-items: center; }
.al-search {
  flex: 1; min-width: 180px; padding: 9px 14px;
  border: 1px solid #D7CCC8; border-radius: 6px;
  background: #FAFAF8; font-size: 14px; color: #4E342E; outline: none;
}
.al-search:focus { border-color: #4E342E; }
.al-sort {
  padding: 9px 14px; border: 1px solid #D7CCC8; border-radius: 6px;
  background: #FAFAF8; font-size: 14px; color: #4E342E; outline: none; cursor: pointer;
}
.al-count { font-size: 13px; color: #8D6E63; margin-left: auto; white-space: nowrap; }

.al-section { margin-bottom: 2.5rem; }
.al-section-header { display: flex; align-items: center; gap: 14px; margin-bottom: 1.25rem; }
.al-section-title { font-size: 1.2rem; font-weight: 500; color: #4E342E; white-space: nowrap; }
.al-section-line { flex: 1; height: 1px; background: #D7CCC8; }
.al-section-badge {
  font-size: 11px; background: #D7CCC8; color: #5D4037;
  padding: 3px 10px; border-radius: 20px; white-space: nowrap;
}

.al-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 1.25rem; }
@media (max-width: 560px) { .al-grid { grid-template-columns: 1fr; } }

.al-card {
  background: #FEFEFE; border: 1px solid #D7CCC8;
  border-radius: 10px; overflow: hidden;
  display: flex; flex-direction: column; transition: border-color 0.2s;
}
.al-card:hover { border-color: #4E342E; }
.al-marketing .al-card { border-left: 3px solid #D7CCC8; }
.al-marketing .al-card:hover { border-color: #4E342E; border-left-color: #4E342E; }

.al-card-img { width: 100%; aspect-ratio: 1/1; object-fit: cover; display: block; }
.al-placeholder {
  width: 100%; aspect-ratio: 1/1;
  display: flex; flex-direction: column;
  align-items: center; justify-content: center; gap: 10px;
}
.al-placeholder-initials { font-size: 2.4rem; font-weight: 500; letter-spacing: 0.05em; }
.al-placeholder-label { font-size: 10px; letter-spacing: 0.14em; text-transform: uppercase; opacity: 0.6; }

.al-card-body { padding: 1rem 1.1rem 1.1rem; flex: 1; display: flex; flex-direction: column; gap: 0.4rem; }
.al-card-title { font-size: 1rem; font-weight: 600; color: #4E342E; line-height: 1.3; }
.al-card-desc { font-size: 13px; color: #6D4C41; line-height: 1.55; flex: 1; }
.al-card-btn {
  display: inline-block; margin-top: 0.6rem; padding: 7px 16px;
  background: #4E342E; color: #F5F5F0; font-size: 13px;
  border-radius: 5px; text-decoration: none; transition: background 0.2s; align-self: flex-start;
}
.al-card-btn:hover { background: #3E2723; }

.al-state { text-align: center; padding: 3rem 1rem; color: #8D6E63; font-size: 15px; }
.al-spinner {
  display: inline-block; width: 28px; height: 28px;
  border: 3px solid #D7CCC8; border-top-color: #4E342E;
  border-radius: 50%; animation: spin 0.8s linear infinite; margin-bottom: 1rem;
}
@keyframes spin { to { transform: rotate(360deg); } }

.al-footer { text-align: center; margin-top: 1rem; font-size: 12px; color: #A1887F; padding-top: 1rem; border-top: 1px solid #D7CCC8; }
.al-footer a { color: #8D6E63; text-decoration: none; }
.al-footer a:hover { color: #4E342E; }
</style>
</head>
<body>

<div class="al-wrap">
  <div class="al-header">
    <div class="al-logo"><a href="https://www.akvarellskiss.se">www.akvarellskiss.se</a></div>
    <h1 class="al-title">ArtLab — Free Artist Tools</h1>
    <p class="al-subtitle">A growing collection of free tools for artists and creatives. Explore, use, and share.</p>
  </div>

  <div class="al-controls">
    <input class="al-search" id="al-search" type="search" placeholder="Search tools…" aria-label="Search tools" />
    <select class="al-sort" id="al-sort" aria-label="Sort tools">
      <option value="default">Default order</option>
      <option value="alpha-asc">A → Z</option>
      <option value="alpha-desc">Z → A</option>
      <option value="newest">Newest first</option>
    </select>
    <span class="al-count" id="al-count"></span>
  </div>

  <div id="al-main">
    <div class="al-state"><div class="al-spinner"></div><br>Loading tools…</div>
  </div>

  <div class="al-footer">
    Free tools for artists by <a href="https://www.akvarellskiss.se">akvarellskiss.se</a>
    &nbsp;·&nbsp;
    <a href="https://www.akvarellskiss.se">Explore more →</a>
  </div>
</div>

<script>
const SITE = 'https://www.akvarellskiss.se';

/* ============================================================
   BILDLISTA — fyll i dina bild-URL:er här.

   Slug = sista delen av sidans URL, t.ex.:
     /artlab-painting-values-tool/ → 'artlab-painting-values-tool'

   Bild-URL hittar du i WP-admin:
     Media → Mediabibliotek → klicka på bilden → kopiera "File URL"

   Lämnar du URL:en tom ('') visas en placeholder med initialer.
   ============================================================ */
const IMAGES = {
  'artlab-painting-values-tool':  https://www.akvarellskiss.se/wp-content/uploads/2026/05/arttools-akvarellskiss-0-17.webp                '',
  'color-harmony-palette':                        '',
  'pigment-database':                             '',
  'perspective-tool':                             '',
  'watercolor-granulation-tool':                  '',
  'artist-mirror':                                '',
  'watercolor-palette-extractor':                 '',
  'art-composition-planner-image-transfer-grid':  '',
  'prisvart-akvarellpapper':                      '',
  'watercolor-paper-price-calculator':            '',
  'image-editor-for-artists':                     '',
  'art-pricing-calculator':                       '',
  'prissattning-konstverk':                       '',
  'certificate-of-authenticity':                  '',
  'mockup-generator':                             '',
  'social-media-art-formatting-guide':            '',
  'artist-signature-tool':                        '',
  'alt-text-generator-artists':                   '',
  'seo-audit-tool-for-artists':                   '',
  'seo-score-dashboard':                          '',
  'copyright-watermark-for-artists':              '',
  'artists-exhibition-companion':                 '',
  'utstallningasassistent':                       '',
  'sell-your-art-online':                         '',
  'utstallningsassistenten':                      '',
};
/* ============================================================ */

const PLACEHOLDER_COLORS = [
  { bg: '#EDE0D4', text: '#5D4037' },
  { bg: '#D7CCC8', text: '#4E342E' },
  { bg: '#BCAAA4', text: '#3E2723' },
  { bg: '#E8D5C4', text: '#6D4C41' },
  { bg: '#F0E6DC', text: '#5D4037' },
  { bg: '#C8B8B0', text: '#3E2723' },
];

function getInitials(title) {
  const skip = ['for','the','a','an','of','in','to','and','your'];
  const words = title.trim().split(/\s+/).filter(w => !skip.includes(w.toLowerCase()));
  if (!words.length) return '??';
  if (words.length === 1) return words[0].slice(0, 2).toUpperCase();
  return (words[0][0] + words[1][0]).toUpperCase();
}

function getColor(title) {
  let h = 0;
  for (let i = 0; i < title.length; i++) h = title.charCodeAt(i) + ((h << 5) - h);
  return PLACEHOLDER_COLORS[Math.abs(h) % PLACEHOLDER_COLORS.length];
}

function stripHtml(html) {
  const d = document.createElement('div');
  d.innerHTML = html || '';
  return d.textContent || d.innerText || '';
}

function truncate(str, n) {
  str = str.trim();
  return str.length > n ? str.slice(0, n).trimEnd() + '…' : str;
}

function buildCard(t) {
  const title = stripHtml(t.title.rendered);
  const desc = truncate(stripHtml(t.excerpt ? t.excerpt.rendered : ''), 110);
  const imgUrl = IMAGES[t.slug] || '';
  let imgHtml;
  if (imgUrl) {
    imgHtml = `<img class="al-card-img" src="${imgUrl}" alt="${title}" loading="lazy" />`;
  } else {
    const col = getColor(title);
    imgHtml = `<div class="al-placeholder" style="background:${col.bg};color:${col.text}">
      <span class="al-placeholder-initials">${getInitials(title)}</span>
      <span class="al-placeholder-label">ArtLab Tool</span>
    </div>`;
  }
  return `<div class="al-card">
    ${imgHtml}
    <div class="al-card-body">
      <div class="al-card-title">${title}</div>
      ${desc ? `<div class="al-card-desc">${desc}</div>` : ''}
      <a class="al-card-btn" href="${t.link}" target="_blank" rel="noopener">Open tool →</a>
    </div>
  </div>`;
}

function sortTools(tools, method) {
  const copy = [...tools];
  if (method === 'alpha-asc') copy.sort((a,b) => stripHtml(a.title.rendered).localeCompare(stripHtml(b.title.rendered)));
  else if (method === 'alpha-desc') copy.sort((a,b) => stripHtml(b.title.rendered).localeCompare(stripHtml(a.title.rendered)));
  else if (method === 'newest') copy.sort((a,b) => new Date(b.date) - new Date(a.date));
  return copy;
}

function renderSection(tools, label, isMarketing) {
  if (!tools.length) return '';
  const cls = isMarketing ? 'al-section al-marketing' : 'al-section';
  return `<div class="${cls}">
    <div class="al-section-header">
      <span class="al-section-title">${label}</span>
      <div class="al-section-line"></div>
      <span class="al-section-badge">${tools.length} ${tools.length === 1 ? 'tool' : 'tools'}</span>
    </div>
    <div class="al-grid">${tools.map(buildCard).join('')}</div>
  </div>`;
}

let artTools = [];
let marketingTools = [];

function render() {
  const q = document.getElementById('al-search').value.toLowerCase();
  const sort = document.getElementById('al-sort').value;

  const filterFn = t => {
    if (!q) return true;
    const title = stripHtml(t.title.rendered).toLowerCase();
    const desc = stripHtml(t.excerpt ? t.excerpt.rendered : '').toLowerCase();
    return title.includes(q) || desc.includes(q);
  };

  const art = sortTools(artTools.filter(filterFn), sort);
  const mkt = sortTools(marketingTools.filter(filterFn), sort);
  const total = art.length + mkt.length;

  document.getElementById('al-count').textContent = total
    ? total + (total === 1 ? ' tool' : ' tools') : '';

  const html = renderSection(art, 'Art Tools', false)
             + renderSection(mkt, 'Marketing Tools', true);
  document.getElementById('al-main').innerHTML = html
    || '<div class="al-state">No tools found matching your search.</div>';
}

async function fetchAll(url) {
  let page = 1, results = [];
  while (true) {
    const r = await fetch(`${url}&page=${page}`);
    if (!r.ok) break;
    const data = await r.json();
    if (!data.length) break;
    results = results.concat(data);
    if (page >= parseInt(r.headers.get('X-WP-TotalPages') || '1')) break;
    page++;
  }
  return results;
}

async function init() {
  const main = document.getElementById('al-main');
  try {
    /* Hämta alla kategorier och hitta Artlab + Marketing tools */
    const catRes = await fetch(`${SITE}/wp-json/wp/v2/categories?per_page=100`);
    const cats = await catRes.json();

    const artlab = cats.find(c => c.slug === 'artlab');
    if (!artlab) {
      main.innerHTML = '<div class="al-state">Could not find the Artlab category.<br><small>Check that the category slug is exactly <strong>artlab</strong> in WordPress.</small></div>';
      return;
    }

    /* Hitta "Marketing tools" som underkategori till Artlab */
    const marketing = cats.find(c =>
      c.parent === artlab.id &&
      c.name.toLowerCase().includes('marketing')
    );
    const marketingId = marketing ? marketing.id : null;

    /* Hämta alla sidor i Artlab-kategorin */
    const fields = '_fields=id,title,excerpt,slug,link,categories,date';
    const all = await fetchAll(
      `${SITE}/wp-json/wp/v2/pages?categories=${artlab.id}&per_page=100&${fields}`
    );

    if (!all.length) {
      main.innerHTML = '<div class="al-state">No tools found in the Artlab category yet.</div>';
      return;
    }

    if (marketingId) {
      marketingTools = all.filter(t => Array.isArray(t.categories) && t.categories.includes(marketingId));
      artTools       = all.filter(t => !Array.isArray(t.categories) || !t.categories.includes(marketingId));
    } else {
      artTools = all;
      marketingTools = [];
    }

    render();
  } catch(e) {
    main.innerHTML = `<div class="al-state">Could not load tools. Check that the WordPress REST API is publicly accessible.<br><small style="color:#A1887F">${e.message}</small></div>`;
  }
}

document.getElementById('al-search').addEventListener('input', render);
document.getElementById('al-sort').addEventListener('change', render);
init();
</script>
</body>
</html>
